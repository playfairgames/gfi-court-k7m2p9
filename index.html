<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6eb4d4" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Go For It Scoring</title>
    <script type="module" crossorigin src="./assets/index-DI36VQB3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C8sR7lql.css">
  </head>
  <body>
    <div id="app">
      <canvas id="court"></canvas>

      <header id="hero">
        <canvas id="hero-gopher" width="160" height="160" aria-hidden="true"></canvas>
        <h1>Go For It <span>Scoring</span></h1>
      </header>

      <aside id="scorebug" aria-live="polite" aria-label="Score">
        <div class="scorebug-row freebie" data-row="server">
          <span class="scorebug-who">
            <span class="scorebug-halo" aria-hidden="true"></span>
            <span class="scorebug-role">Server</span>
          </span>
          <span class="scorebug-pts" data-score="server">0</span>
        </div>
        <div class="scorebug-row freebie" data-row="receiver">
          <span class="scorebug-who">
            <span class="scorebug-halo" aria-hidden="true"></span>
            <span class="scorebug-role">Receiver</span>
          </span>
          <span class="scorebug-pts" data-score="receiver">0</span>
        </div>
      </aside>

      <div id="orbit-hint" aria-hidden="true">
        <svg viewBox="0 0 72 48" width="52" height="35">
          <path
            d="M28 44c-6.2 0-10-3.4-10-8.4V18.2c0-1.6 1.2-2.8 2.8-2.8s2.8 1.2 2.8 2.8v9.2h1.2V12.4c0-1.6 1.2-2.8 2.8-2.8s2.8 1.2 2.8 2.8v14.2h1.1V8.6c0-1.6 1.2-2.8 2.8-2.8s2.8 1.2 2.8 2.8v17.6h1.1V11.2c0-1.6 1.3-2.8 2.9-2.8s2.8 1.2 2.8 2.8v22.4c0 6.4-4.2 10.4-11.1 10.4z"
            fill="#1c1610"
          />
        </svg>
      </div>

      <pre id="cam-tune" hidden></pre>

      <div id="callout" class="callout hidden" aria-live="polite"></div>

      <div id="explain" class="callout explain hidden" aria-live="polite"></div>

      <div id="caption" class="line hidden" aria-live="polite"></div>

      <nav id="hud" class="tab-bar">
        <div class="ask-bar">
          <div class="ask">
            <button type="button" id="btn-ask-server">Server</button>
            <div class="ask-menu" id="menu-server" hidden>
              <button type="button" data-play="ace">Ace</button>
              <button type="button" data-play="serverMiss">Misses</button>
            </div>
          </div>
          <div class="ask">
            <button type="button" id="btn-ask-receiver">Receiver</button>
            <div class="ask-menu" id="menu-receiver" hidden>
              <button type="button" data-play="receiverMiss">Misses</button>
              <button type="button" data-play="receiverWinner">Hits a winner</button>
            </div>
          </div>
          <button type="button" id="btn-reset" class="ghost">Reset</button>
        </div>
      </nav>
    </div>
  </body>
</html>
